[project]
name = "winged-wheel-analytics"
version = "0.1.0"
description = "Detroit Red Wings hockey-operations data pipeline: NHL API -> DuckDB warehouse -> xG model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pytz>=2026.5",
    "scikit-learn>=1.5",
]

[project.scripts]
wings = "wings.cli:main"

[dependency-groups]
# streamlit is pinned to match app/requirements.txt (the Community Cloud runtime)
dev = ["pytest>=8", "ruff>=0.6", "streamlit==1.66.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wings"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
